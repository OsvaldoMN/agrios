<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AgriOS</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-brand-header">
      <div class="login-brand-title">Agri<span>OS</span></div>
      <div class="login-brand-subtitle">Gestão de Ordens de Serviço Agrícolas</div>
    </div>

    <!-- Mensagens de Alerta -->
    <div id="loginAlert" style="display: none; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 20px;"></div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group" style="margin-bottom: 16px;">
        <label for="usernameInput" class="form-label required">Usuário</label>
        <div style="position: relative;">
          <input 
            type="text" 
            id="usernameInput" 
            class="form-control" 
            placeholder="Digite seu usuário" 
            required 
            autofocus
            style="padding-left: 36px;"
          >
          <i class="bi bi-person" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-light);"></i>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label for="passwordInput" class="form-label required">Senha</label>
        <div style="position: relative;">
          <input 
            type="password" 
            id="passwordInput" 
            class="form-control" 
            placeholder="Digite sua senha" 
            required
            style="padding-left: 36px;"
          >
          <i class="bi bi-lock" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-light);"></i>
        </div>
      </div>

      <button type="submit" id="submitLoginBtn" class="btn btn-primary" style="width: 100%; padding: 10px; font-weight: 600;">
        <span>Acessar o Sistema</span>
        <i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <div style="margin-top: 24px; text-align: center; font-size: 0.78rem; color: var(--text-light);">
      AgriOS &copy; 2026 - Acesso Restrito
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script th:src="@{/js/api.js}" src="/js/api.js"></script>
  <script th:src="@{/js/app.js}" src="/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Se já estiver autenticado, redireciona para o dashboard
      if (Api.isAuthenticated()) {
        window.location.href = "/dashboard";
        return;
      }

      const alertEl = document.getElementById("loginAlert");
      const urlParams = new URLSearchParams(window.location.search);

      // Tratamento de feedback na URL
      if (urlParams.get("expired")) {
        showAlert("Sua sessão expirou por inatividade. Faça login novamente.", "warning");
      } else if (urlParams.get("logout")) {
        showAlert("Sessão encerrada com sucesso.", "info");
      }

      function showAlert(msg, type = "error") {
        alertEl.style.display = "block";
        if (type === "warning") {
          alertEl.style.backgroundColor = "#fef3c7";
          alertEl.style.color = "#92400e";
          alertEl.style.border = "1px solid #fde68a";
        } else if (type === "info") {
          alertEl.style.backgroundColor = "#e0f2fe";
          alertEl.style.color = "#0369a1";
          alertEl.style.border = "1px solid #bae6fd";
        } else {
          alertEl.style.backgroundColor = "#fee2e2";
          alertEl.style.color = "#991b1b";
          alertEl.style.border = "1px solid #fecaca";
        }
        alertEl.innerHTML = `<i class="bi bi-info-circle me-1"></i> ${msg}`;
      }

      const form = document.getElementById("loginForm");
      const submitBtn = document.getElementById("submitLoginBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertEl.style.display = "none";

        const username = document.getElementById("usernameInput").value.trim();
        const password = document.getElementById("passwordInput").value;

        if (!username || !password) {
          showAlert("Informe o usuário e a senha.", "error");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Conectando...';

        try {
          const res = await Api.post("/auth/login", { username, password });

          if (res && res.token) {
            // Decodifica carga do JWT para extrair a Role se disponível, ou assume ADMIN/USER
            let role = "USER";
            try {
              const payload = JSON.parse(atob(res.token.split(".")[1]));
              if (payload.role) {
                role = payload.role;
              } else if (payload.roles) {
                role = payload.roles[0];
              }
            } catch (err) {
              // fallback
            }

            Api.setSession(res.token, username, role);
            window.location.href = "/dashboard";
          } else {
            showAlert("Erro ao processar autenticação.", "error");
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Acessar o Sistema</span> <i class="bi bi-arrow-right"></i>';
          }
        } catch (error) {
          showAlert(error.message || "Usuário ou senha incorretos.", "error");
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Acessar o Sistema</span> <i class="bi bi-arrow-right"></i>';
        }
      });
    });
  </script>
</body>
</html>
