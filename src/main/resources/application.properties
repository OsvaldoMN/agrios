spring.application.name=agrios

spring.datasource.url=jdbc:mysql://localhost:3306/agrios?useTimezone=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

api.security.token.secret=${JWT_SECRET}






backup.directory=backups

backup.mysql-dump-path=C:/Program Files/MySQL/MySQL Server 9.7/bin/mysqldump.exe
backup.mysql-path=C:/Program Files/MySQL/MySQL Server 9.7/bin/mysql.exe

backup.database=agrios
backup.host=localhost
backup.port=3306

backup.username=${DB_USERNAME}
backup.password=${DB_PASSWORD}

backup.cron=0 0 10 * * *

